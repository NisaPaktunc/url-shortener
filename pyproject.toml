[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener"
version = "0.1.0"
description = "A URL shortener with click analytics, built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "user-agents>=2.2",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "alembic>=1.13",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",  # Postgres driver
    "slowapi>=0.1.9",  # rate limiting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs,
# S: security, SIM: simpler code, C4: comprehensions, PT: pytest style.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "PT"]

[tool.ruff.lint.isort]
# The project has an "alembic/" folder, so without this ruff would treat the
# alembic library as our own code.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed passwords on purpose.
"tests/**" = ["S101", "S105", "S106"]
# The seed script makes fake data, so predictable random numbers are fine,
# and the demo password is public on purpose.
"scripts/seed.py" = ["S105", "S311"]
